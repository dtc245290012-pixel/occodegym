<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thực hành Nền và Ảnh nền CSS</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Tiêu đề h1 -->
    <h1>Chào mừng đến với trang web của tôi</h1>

    <!-- Đoạn văn p -->
    <p class="description">Trang web này thử nghiệm thiết lập màu nền cho toàn bộ trang và ảnh nền cho khối nội dung quan trọng.</p>

    <!-- Khối div chứa nội dung quan trọng -->
    <div class="important-box">
        <h2>Nội dung quan trọng</h2>
        <p>Khối này sử dụng ảnh nền (background-image) kết hợp với màu phủ mờ để nội dung bên trong được hiển thị rõ ràng và nổi bật.</p>
    </div>

</body>
</html>
