<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thực hành Bộ chọn CSS</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Element & ID Selector -->
    <h1 id="main-title">Trang web của tôi</h1>

    <!-- Element & Class Selector -->
    <p class="description">
        Xin chào! Tôi là một học viên lập trình web đang luyện tập sử dụng các bộ chọn CSS để trang trí giao diện trang web.
    </p>

    <!-- Grouping & Pseudo-class Selector cho danh sách -->
    <h2>Sở thích của tôi</h2>
    <ul class="hobby-list">
        <li class="item-1">Đọc sách công nghệ</li>
        <li class="item-2">Lập trình Web</li>
        <li class="item-3">Chơi thể thao</li>
    </ul>

    <!-- Pseudo-class :hover Selector cho nút bấm -->
    <div class="button-container">
        <button id="btn-action">Nhấn vào đây</button>
    </div>

</body>
</html>
